name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Линтеры, типы, модульные тесты, сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm run format:check
      - run: npm run type-check
      # Покрытие домена 100% — порог в vitest.config.ts.
      - run: npm run test:coverage
      - run: npm run build-only

  e2e:
    name: Сквозные тесты
    runs-on: ubuntu-latest
    # Браузеры и системные библиотеки уже в образе, apt на каждом прогоне не нужен.
    # Тег образа должен совпадать с версией @playwright/test в package-lock.json —
    # при обновлении пакета поднять тег здесь и PLAYWRIGHT_VERSION ниже.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    env:
      PLAYWRIGHT_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Версия образа совпадает с @playwright/test
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          if [ "$installed" != "$PLAYWRIGHT_VERSION" ]; then
            echo "::error::@playwright/test $installed, а образ CI на $PLAYWRIGHT_VERSION — обновите тег образа в ci.yml"
            exit 1
          fi
      # На CI Playwright поднимает npm run preview, ему нужна собранная версия.
      - run: npm run build-only
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    name: Публикация на GitHub Pages
    # Только после зелёных проверок и сквозных тестов на master.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v6
        id: pages
      - run: npm run build-only
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/deploy-pages@v5
        id: deployment
