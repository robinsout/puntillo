name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Линтеры, типы, модульные тесты, сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm run format:check
      - run: npm run type-check
      # Enforces 100% domain coverage; the threshold lives in vitest.config.ts.
      - run: npm run test:coverage
      - run: npm run build-only

  e2e:
    name: Сквозные тесты (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, Mobile Chrome, Mobile Safari]
    # Browsers and system deps are baked into the image, so no apt on every run.
    # The tag must match @playwright/test in package-lock.json: bump it together with PLAYWRIGHT_VERSION.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    env:
      PLAYWRIGHT_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Версия образа совпадает с @playwright/test
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          if [ "$installed" != "$PLAYWRIGHT_VERSION" ]; then
            echo "::error::@playwright/test $installed, а образ CI на $PLAYWRIGHT_VERSION — обновите тег образа в ci.yml"
            exit 1
          fi
      # On CI Playwright serves `npm run preview`, which needs a build.
      - run: npm run build-only
      - run: npx playwright test --project="${{ matrix.project }}"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

  deploy:
    name: Публикация на GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v6
        id: pages
      - run: npm run build-only
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_COUNTER_ENDPOINT: https://188.245.182.47/c/hit
      # Pages has no SPA fallback: it serves 404.html for a direct link like /wiki/durations,
      # and as a copy of the app the router opens the page of that address.
      - run: cp dist/index.html dist/404.html
      # Spec §18: Lighthouse, mobile profile, on the build about to be published. The scores go out
      # with the site as endpoint badges for the README, and a time to interactive over the budget
      # stops the deploy.
      - name: Lighthouse
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          npx vite preview --base "$BASE_PATH" --port 4173 --strictPort &
          for attempt in $(seq 1 30); do curl -sf "http://localhost:4173$BASE_PATH" > /dev/null && break; sleep 1; done
          mkdir -p lighthouse
          npx -y lighthouse@12.6.1 "http://localhost:4173$BASE_PATH" --quiet \
            --chrome-flags="--headless=new --no-sandbox" \
            --output=json --output=html --output-path=./lighthouse/report
          node scripts/lighthouse-badges.mjs lighthouse/report.report.json dist/badges
          mkdir -p dist/lighthouse && cp lighthouse/report.report.html dist/lighthouse/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/deploy-pages@v5
        id: deployment
